name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        run: ./scripts/validate.sh
      - name: Compose config sanity
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example config --services | grep -qx 'codex-relay'
      - name: Check .dockerignore consistency
        run: |
          test -f .dockerignore || exit 1
          grep -q 'compose.override.yaml' .dockerignore

  build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push'
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/codex-relay:latest
